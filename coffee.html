<style>
  :root {

  input { flex: 1; min-width: 0; padding: .85rem .9rem; border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; font-size: 1rem; border-radius: 0; }

  button:disabled { opacity: .6; cursor: wait; }
  .msg { min-height: 1.5rem; margin: .8rem 0 0; color: var(--muted); }
  .msg.err { color: light-dark(#a3342c, #ff9b8f); }
  .back { display: inline-block; margin-top: 3rem; color: var(--muted); }

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.salt),iterations:D.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.iv)},key,u(D.ct));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
const f=document.getElementById("f"),msg=document.getElementById("msg"),go=document.getElementById("go"),pw=document.getElementById("pw");
f.addEventListener("submit",async e=>{
  e.preventDefault();go.disabled=true;msg.className="msg";msg.textContent="Brewing…";
  try{const html=await unlock(pw.value);try{sessionStorage.setItem("coffee-pw",pw.value)}catch(_){};show(html);}
  catch(_){msg.className="msg err";msg.textContent="Wrong password. Try again.";go.disabled=false;pw.select();}
});
(async()=>{let s=null;try{s=sessionStorage.getItem("coffee-pw")}catch(_){}
  if(s){try{show(await unlock(s))}catch(_){try{sessionStorage.removeItem("coffee-pw")}catch(_){}}}})();
</script>
