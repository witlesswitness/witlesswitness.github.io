<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Contact Charles Timmons, a Seattle-based cybersecurity practitioner interested in education, ethics, and technology safety.">
<title>Contact — Charles Timmons</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f3f1e9, #111719);
    --fg: light-dark(#202b2b, #f0f0e7);
    --muted: light-dark(#778780, #8ba39a);
    --accent: light-dark(#176b58, #a4f4d0);
    --line: light-dark(#c9d0c7, #344340);
    --focus: light-dark(#176b58, #a4f4d0);
    --field: light-dark(#faf9f4, #192120);
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; background: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: min(100% - 3rem, 690px);
    min-height: 100vh;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-block: clamp(3.5rem, 10vh, 7rem);
  }
  .eyebrow {
    margin: 0 0 2rem;
    color: var(--muted);
    font: 500 .7rem/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 1.5rem;
    font-size: clamp(3.4rem, 10vw, 6.5rem);
    font-weight: 450;
    letter-spacing: -.055em;
    line-height: .95;
  }
  h1 span { color: var(--accent); }
  .intro {
    max-width: 38rem;
    margin: 0 0 2.5rem;
    color: var(--muted);
    font-size: clamp(1rem, 2.8vw, 1.12rem);
    line-height: 1.7;
  }
  form { border-top: 1px solid var(--line); }
  .field {
    display: block;
    padding: 1.25rem 0;
    border-bottom: 1px solid var(--line);
  }
  .field-label {
    display: block;
    margin-bottom: .7rem;
    color: var(--muted);
    font: 500 .72rem/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  input, textarea {
    display: block;
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: .9rem 1rem;
    background: var(--field);
    color: var(--fg);
    font: inherit;
    line-height: 1.5;
    outline: none;
    transition: border-color 180ms ease, box-shadow 180ms ease;
  }
  input { min-height: 3.2rem; }
  textarea { min-height: 12rem; resize: vertical; }
  input:focus, textarea:focus {
    border-color: var(--focus);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
  .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding-top: 1.5rem;
  }
  button {
    display: inline-flex;
    align-items: center;
    gap: 1.5rem;
    min-height: 3.5rem;
    padding: .85rem 1.1rem;
    border: 1px solid var(--accent);
    border-radius: 2px;
    background: var(--accent);
    color: var(--bg);
    font: 600 .95rem/1.2 ui-sans-serif, system-ui, sans-serif;
    cursor: pointer;
    transition: background 180ms ease, color 180ms ease, transform 180ms ease;
  }
  button:hover { background: transparent; color: var(--accent); transform: translateY(-1px); }
  button:focus-visible, .back:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
  .back {
    color: var(--muted);
    text-decoration: none;
    font-size: .92rem;
    transition: color 180ms ease;
  }
  .back:hover, .linkedin:hover { color: var(--accent); }
  .linkedin {
    display: inline-block;
    width: fit-content;
    margin: -1rem 0 2rem;
    color: var(--muted);
    text-decoration: none;
    font-size: .92rem;
    transition: color 180ms ease;
  }
  .linkedin:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
  .arrow { font-size: 1.15rem; }
  @media (max-width: 420px) {
    main { width: calc(100% - 2.5rem); }
    .actions { align-items: flex-start; flex-direction: column-reverse; }
    textarea { min-height: 10rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; }
  }
</style>
<link rel="canonical" href="https://www.charlestimmons.com/contact.html">
</head>
<body>
<main>
  <p class="eyebrow">Personal website <span aria-hidden="true">/</span> 03</p>
  <h1>Get in<br><span>touch.</span></h1>
  <p class="intro">Have a question, an idea, or something worth discussing? Send me a note.</p>
  <a class="linkedin" href="https://www.linkedin.com/in/charles-timmons" target="_blank" rel="noopener noreferrer">Or find me on LinkedIn ↗</a>
  <form action="https://formspree.io/f/mpzolqwl" method="POST">
    <label class="field">
      <span class="field-label">Your email address</span>
      <input type="email" name="_replyto" autocomplete="email" placeholder="you@example.com" required>
    </label>
    <label class="field">
      <span class="field-label">Your message</span>
      <textarea name="message" rows="7" placeholder="What’s on your mind?" required></textarea>
    </label>
    <div class="actions">
      <a class="back" href="/">← Back to homepage</a>
      <button type="submit">Send message <span class="arrow" aria-hidden="true">↗</span></button>
    </div>
  </form>
</main>
</body>
</html>
