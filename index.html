<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>Charles Timmons</title>
    
    <link href="style.css" rel="stylesheet" type="text/css" />

    <style>
      @import url('https://fonts.googleapis.com/css?family=Advent+Pro:100');

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      html { 
        background: url('https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif')
          no-repeat center center fixed;
        background-size: cover;
      }

      h1 {
        font-family: 'Advent Pro', sans-serif;
        font-size: 3em;
        margin: .2em .5em;
        color: rgba(0,0,0,0.3);
      }

      /* ☕ THE SECRET COFFEE PORTAL ☕ */

      .coffee-portal {
        position: fixed;
        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);

        font-size: clamp(70px, 12vw, 120px);
        text-decoration: none;

        cursor: pointer;

        filter: drop-shadow(0 5px 8px rgba(0,0,0,.35));

        transition:
          transform .2s ease,
          filter .2s ease;
      }

      .coffee-portal:hover {
        transform:
          translate(-50%, -50%)
          scale(1.2)
          rotate(-8deg);

        filter:
          drop-shadow(0 10px 12px rgba(0,0,0,.45));
      }

      .coffee-portal:active {
        transform:
          translate(-50%, -50%)
          scale(.9);
      }
    </style>
  </head>

  <body>

    <!-- ☕ ENTER THE ESPRESSO ZONE ☕ -->

    <a
      class="coffee-portal"
      href="https://charlestimmons.com/coffee"
      aria-label="Enter the espresso page"
      title="☕ ???"
    >
      ☕
    </a>

    <script src="script.js"></script>

  </body>
</html>
