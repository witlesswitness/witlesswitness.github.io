<meta name="description" content="Charles Timmons is a Seattle-based cybersecurity practitioner exploring education, ethics, and safety in today's and tomorrow's technologies. Read his writing or get in touch.">
<title>Charles Timmons</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f3f1e9, #111719);
    --fg: light-dark(#202b2b, #f0f0e7);
    --muted: light-dark(#778780, #8ba39a);
    --accent: light-dark(#176b58, #a4f4d0);
    --line: light-dark(#c9d0c7, #344340);
    --focus: light-dark(#176b58, #a4f4d0);
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; background: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    min-height: 100vh;
    width: min(100% - 3rem, 690px);
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-block: clamp(4rem, 12vh, 9rem);
  }
  .eyebrow {
    margin: 0 0 2.4rem;
    color: var(--muted);
    font: 500 .7rem/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 clamp(2.5rem, 7vh, 4.5rem);
    font-size: clamp(3.7rem, 11vw, 7.4rem);
    font-weight: 450;
    letter-spacing: -.025em;
    line-height: .92;
  }
  h1 span { color: var(--accent); }
  nav { border-top: 1px solid var(--line); }
  nav a {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    min-height: 4.3rem;
    display: grid;
    grid-template-columns: 2.5rem 1fr 1.5rem;
    align-items: center;
    gap: .75rem;
    border-bottom: 1px solid var(--line);
    color: var(--fg);
    text-decoration: none;
    transition: color 220ms ease, padding 220ms ease;
  }
  nav a::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 0;
    background: linear-gradient(105deg, transparent 20%, color-mix(in srgb, var(--accent) 13%, transparent) 45%, color-mix(in srgb, var(--accent) 28%, transparent) 50%, color-mix(in srgb, var(--accent) 13%, transparent) 55%, transparent 80%);
    transform: translateX(-120%);
    transition: transform 650ms cubic-bezier(.2,.7,.2,1);
    pointer-events: none;
  }
  .num {
    color: var(--muted);
    font: 500 .72rem/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    letter-spacing: .04em;
  }
  .label { font-size: clamp(1.08rem, 3vw, 1.25rem); letter-spacing: -.025em; }
  .arrow {
    justify-self: end;
    color: var(--accent);
    font-size: 1.2rem;
    opacity: .75;
    transform: translate(-2px, 2px);
    transition: transform 180ms ease, opacity 180ms ease;
  }
  nav a:hover { color: var(--accent); padding-inline: .35rem; }
  nav a:hover::before, nav a:focus-visible::before { transform: translateX(120%); }
  nav a:hover .arrow { opacity: 1; transform: translate(0, 0); }
  nav a:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
  @media (max-width: 420px) {
    main { width: calc(100% - 2.5rem); }
    .eyebrow { margin-bottom: 2rem; }
    nav a { min-height: 4rem; grid-template-columns: 2rem 1fr 1.25rem; }
  }
</style>
<link rel="canonical" href="https://www.charlestimmons.com/">

<meta property="og:description" content="Seattle-based cybersecurity practitioner exploring education, ethics, and safety in technology.">
